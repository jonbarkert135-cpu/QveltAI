    { name = "build" },
    { name = "hatchling" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "types-pyyaml" },
]

[package.metadata]
requires-dist = [
    { name = "numpy", specifier = "==2.2.6" },
    { name = "pyyaml", specifier = "==6.0.3" },
    { name = "torch", marker = "sys_platform == 'darwin' and extra == 'cpu'", specifier = "==2.9.1" },
    { name = "torch", marker = "sys_platform != 'darwin' and extra == 'cpu'", specifier = "==2.9.1", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "qvelt", extra = "cpu" } },
    { name = "torch", marker = "(sys_platform == 'linux' and extra == 'cuda') or (sys_platform == 'win32' and extra == 'cuda')", specifier = "==2.9.1", index = "https://download.pytorch.org/whl/cu128", conflict = { package = "qvelt", extra = "cuda" } },
