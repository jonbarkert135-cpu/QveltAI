name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      TORCHINDUCTOR_COMPILE_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned project manager
        run: python -m pip install uv==0.12.23
      - name: Frozen setup
        run: make setup
      - name: Dependency consistency
        run: |
          uv lock --check
          uv pip check
      - name: Lint and types
        run: make lint typecheck
      - name: CPU unit and integration tests (includes actual tiny decoder)
        run: make test
      - name: Functional CLI and build
        run: |
          uv run --frozen --extra cpu qvelt config validate configs/model/tiny.yaml
          uv run --frozen --extra cpu qvelt doctor --device cpu
          uv run --frozen --extra cpu qvelt run init configs/model/tiny.yaml --directory "$RUNNER_TEMP/qvelt-run" --repository .
          uv run --frozen --extra cpu qvelt manifest verify "$RUNNER_TEMP/qvelt-run/manifest.json"
          uv run --frozen --extra cpu qvelt tokenizer train configs/tokenizer_smoke.yaml --data-manifest tests/fixtures/tokenizer/train.manifest.json --directory "$RUNNER_TEMP/qvelt-tokenizer" --repository .
          uv run --frozen --extra cpu qvelt tokenizer verify "$RUNNER_TEMP/qvelt-tokenizer/manifest.json"
          make build
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make setup
      - name: 100 real updates and stop37/resume100 exact Adam/weight replay
        run: uv run --frozen --extra cpu python scripts/smoke.py --directory "$RUNNER_TEMP/qvelt-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-smoke-logs-and-checkpoints
          path: ${{ runner.temp }}/qvelt-smoke
  data-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make setup
      - name: Offline raw text to shards and exact prefetched crash replay
        run: uv run --frozen --extra cpu python scripts/data_smoke.py --directory "$RUNNER_TEMP/qvelt-data-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-data-smoke-and-cursor
          path: ${{ runner.temp }}/qvelt-data-smoke
  packed-pretraining:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make setup
      - name: Offline BPE optimization and atomic model Adam loader replay
        run: uv run --frozen --extra cpu python scripts/pretraining_smoke.py --directory "$RUNNER_TEMP/qvelt-pretraining-smoke" --steps 20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packed-pretraining-logs-and-checkpoints
          path: ${{ runner.temp }}/qvelt-pretraining-smoke
  optional-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make EXTRA_ARGS="--extra tensorboard --extra wandb" setup
      - name: Actual TensorBoard event and W&B offline run
        run: uv run --frozen --extra cpu --extra tensorboard --extra wandb pytest tests/unit/test_metrics.py -q
  supervised-finetuning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make setup
      - name: Original math SFT overfit and exact model Adam RNG consumer replay
        run: uv run --frozen --extra cpu python scripts/sft_smoke.py --directory "$RUNNER_TEMP/qvelt-sft-smoke" --steps 80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supervised-finetuning-logs-and-checkpoints
          path: ${{ runner.temp }}/qvelt-sft-smoke
  pretraining-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make setup
      - name: Full RFC tiny 200 updates, actual SIGKILL and exact whole-curve replay
        run: uv run --frozen --extra cpu python scripts/pretraining_acceptance.py --directory "$RUNNER_TEMP/qvelt-recovery-200" --repository .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pretraining-recovery-200-evidence
          path: |
            ${{ runner.temp }}/qvelt-recovery-200/training/acceptance-result.json
            ${{ runner.temp }}/qvelt-recovery-200/training/**/*.log
            ${{ runner.temp }}/qvelt-recovery-200/training/**/metrics-*.jsonl
            ${{ runner.temp }}/qvelt-recovery-200/training/**/manifest.json
