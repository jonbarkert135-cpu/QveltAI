name: Framework release candidate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag
        required: true
        default: v0.1.0
      create_draft:
        description: Create a draft GitHub release after validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UV_PYTHON: "3.12"
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      QVELT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: make EXTRA_ARGS="--extra docs" setup
      - run: make EXTRA_ARGS="--extra docs" lint typecheck docs build
      - name: Version,distribution contents and checksums
        run: uv run --frozen --extra cpu python scripts/check_release.py --tag "$QVELT_RELEASE_TAG"
      - name: Security and credentials
        run: |
          uv run --frozen --extra cpu python scripts/security_review.py --directory "$RUNNER_TEMP/security" --dependencies
          uv run --frozen --extra cpu python scripts/check_secrets.py
      - name: Replace editable install with the built wheel over locked dependencies
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -c 'import os,qvelt;assert qvelt.__version__ == os.environ["QVELT_RELEASE_TAG"][1:];assert "site-packages/qvelt" in qvelt.__file__'
          .venv/bin/qvelt doctor --device cpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-release-candidate
          path: |
            dist/
            site/
            ${{ runner.temp }}/security/deserialization.json
            ${{ runner.temp }}/security/dependencies.json
      - name: Create operator-requested draft only
        if: startsWith(github.ref,'refs/tags/v') || inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$QVELT_RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "Qvelt $QVELT_RELEASE_TAG" --notes-file CHANGELOG.md
