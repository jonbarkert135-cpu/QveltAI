# Short fixed-token LR x global-batch sweep for `small` (RFC: 0.5x/1x/2x LR).
# `base` is the recipe generated by scripts/make_pretrain_recipe.py (runbook 02).
name: small-lr-batch
base: ../../runs/small/pretraining.yaml
output: ../../runs/sweeps/small-lr-batch
repository: .
launcher: ["torchrun", "--standalone", "--nproc-per-node=8", "-m", "qvelt"]
# 2000 updates x 131,072 = ~262M token capacity per point at the base batch.
stop_after: 2000
preserve_tokens: true
fixed:
  job.training.checkpoint_every: 500
  sample_every: 0
grid:
  job.training.learning_rate: [3.0e-4, 6.0e-4, 1.2e-3]
  accumulation_steps: [1, 2]
  job.experiment.runtime.seed: [20261031, 20261104]
