[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "qvelt"
version = "0.1.0.dev0"
description = "Original, reproducible language-model research infrastructure"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyYAML==6.0.3",
    "numpy==2.2.6",
    "safetensors==0.6.2",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]
cuda = ["torch==2.9.1; sys_platform == 'linux' or sys_platform == 'win32'"]
tensorboard = [
    "tensorboard==2.19.0",
]
wandb = [
    "wandb==0.19.11",
]

[project.scripts]
qvelt = "qvelt.cli:main"

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.13",
  "mypy==1.15.0",
  "types-PyYAML==6.0.12.20261030",
  "build==1.6.1",
  "hatchling==1.27.0",
  "pre-commit==4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qvelt"]

[tool.uv]
required-version = "==0.12.23"
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'"},
  {index = "pytorch-cu128", extra = "cuda"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "docs/research"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = ["unit: isolated correctness checks", "integration: workflows and real IO/processes", "gpu: requires CUDA hardware", "slow: longer validation runs"]
filterwarnings = ["error"]

[tool.ruff]
extend-exclude = [".agents/skills"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "docs/research"]
mypy_path = ["docs/research"]

[[tool.mypy.overrides]]
module = "torch.*"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tokenizers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wandb.*", "tensorboard.*"]
ignore_missing_imports = true
follow_imports = "silent"
